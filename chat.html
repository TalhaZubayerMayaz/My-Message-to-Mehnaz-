<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1745">
<meta name="application-name" content="OurChat">
<meta name="apple-mobile-web-app-title" content="OurChat">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OurChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#150d24; --plum:#2a1745;
  --rose:#f2799f; --rose2:#d4568f; --glow:#ffc7da;
  --ink:#f6edfb; --muted:#b5a2c9;
  --glass:rgba(255,255,255,.08); --edge:rgba(255,255,255,.14);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(242,121,159,.28),transparent 60%),
    radial-gradient(700px 500px at -10% 110%,rgba(120,80,200,.35),transparent 60%),
    linear-gradient(180deg,var(--plum),var(--night));
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.75;
  background-image:
    radial-gradient(1px 1px at 12% 18%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 78% 12%,#ffe3ee,transparent),
    radial-gradient(1px 1px at 40% 8%,#fff,transparent),
    radial-gradient(1px 1px at 92% 38%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 6% 52%,#ffe3ee,transparent),
    radial-gradient(1px 1px at 60% 30%,#fff,transparent);
}
button,input,textarea{font:inherit}
.hidden{display:none!important}

/* login */
#login{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:350px;padding:34px 26px 28px;border-radius:26px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-box h1{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:42px;color:var(--glow);line-height:1.1}
.login-box p{color:var(--muted);font-size:14px;margin:6px 0 24px}
.login-box input{width:100%;padding:14px 16px;margin-bottom:12px;border-radius:14px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--ink)}
.login-box input::placeholder,#msg::placeholder,#search::placeholder{color:var(--muted)}
.login-box input:focus,#msg:focus,#search:focus{outline:2px solid var(--rose);outline-offset:1px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;color:#fff;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--rose),var(--rose2));box-shadow:0 8px 24px rgba(212,86,143,.4)}
.btn:active{transform:scale(.98)}
#err{color:#ffb3c1;font-size:13px;min-height:18px;margin-top:12px}

/* shell */
#app{position:relative;z-index:1;height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header{position:relative;z-index:3;padding:calc(12px + var(--safe-top)) 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(21,13,36,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--edge)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:"Fraunces",serif;font-style:italic;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--rose),var(--rose2));box-shadow:0 4px 14px rgba(212,86,143,.4)}
header h2{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:24px;color:var(--glow);line-height:1.05}
header small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.round{width:40px;height:40px;flex:none;border-radius:50%;background:var(--glass);border:1px solid var(--edge);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.round.small{width:32px;height:32px;font-size:18px;line-height:1}
#menu{position:absolute;right:12px;top:calc(100% - 2px);min-width:190px;background:rgba(30,18,50,.97);border:1px solid var(--edge);border-radius:14px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:11px 12px;border-radius:10px;cursor:pointer}
#menu button:hover{background:var(--glass)}
#menu .warn{color:#ffb3c1}
#menu .mine{display:flex;align-items:center;gap:10px;padding:8px 12px 10px;margin-bottom:4px;border-bottom:1px solid var(--edge);font-weight:500}
.av{background-size:cover;background-position:center;cursor:pointer}
.av.sm{width:38px;height:38px;font-size:19px;cursor:default}
body.nostars::before{display:none}
#app.home #list,#app.home #replybar,#app.home #attachbar,#app.home form,#app.home #back{display:none}
#app:not(.home) #chats,#app:not(.home) #fab{display:none}
#chats{flex:1;overflow-y:auto;padding:8px 10px}
#search{display:block;width:calc(100% - 24px);margin:12px 12px 4px;padding:11px 18px;border-radius:999px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--ink)}
#app:not(.home) #search{display:none}
.ci{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:16px;background:none;color:var(--ink);text-align:left;cursor:pointer}
.ci:hover{background:var(--glass)}
.ci .t2{flex:1;min-width:0}
.ci b{display:block;font-weight:700}
.ci small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rose);flex:none}
#fab{position:absolute;right:18px;bottom:calc(20px + var(--safe-bottom));width:56px;height:56px;border:0;border-radius:50%;font-size:30px;line-height:1;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--rose),var(--rose2));box-shadow:0 8px 24px rgba(212,86,143,.5)}
.pp{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;padding:8px 10px;border-radius:14px;border:2px solid transparent;background:var(--glass);color:var(--ink);cursor:pointer;text-align:left}
.pp.on{border-color:var(--glow)}
#gname,#gEdit{width:100%;padding:12px 14px;margin-bottom:12px;border-radius:14px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--ink)}
.hint{color:var(--muted);font-size:13px;margin-bottom:12px}
#bgSheet,#newSheet,#grpSheet{position:fixed;inset:0;z-index:15;background:rgba(10,5,20,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;background:rgba(30,18,50,.98);border:1px solid var(--edge);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-bottom))}
.sheet h3{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:24px;color:var(--glow);margin-bottom:12px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-bottom:14px}
.sw{height:68px;border-radius:14px;border:2px solid transparent;cursor:pointer;color:#fff;font-size:12px;font-weight:500;display:flex;align-items:flex-end;padding:7px 8px;text-align:left;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.sw.on{border-color:var(--glow)}
.sheet .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.pill{background:var(--glass);border:1px solid var(--edge);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:500;cursor:pointer}
#dimWrap{margin-bottom:14px}
#dimWrap label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
#dim{width:100%;accent-color:var(--rose)}

/* messages */
#list{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.empty{margin:auto;color:var(--muted);text-align:center;font-size:15px}
.empty svg{display:block;margin:0 auto 10px;color:var(--rose)}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--glass);border:1px solid var(--edge);padding:3px 12px;border-radius:999px;margin:14px 0 6px}
.row{display:flex;flex-direction:column}
.row.first{margin-top:10px}
.row.has-rx{margin-bottom:8px}
.row.me{align-items:flex-end}
.row.them{flex-direction:row;align-items:flex-end;gap:8px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.avs{width:30px;flex:none}
.av.xs{width:30px;height:30px;font-size:15px;cursor:default;box-shadow:none}
.sname{font-size:12px;color:var(--muted);margin:0 0 3px 6px}
.m{max-width:78%;padding:9px 14px 7px;border-radius:20px;line-height:1.42;overflow-wrap:anywhere;cursor:pointer}
.txt{white-space:pre-wrap}
.me .m{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;box-shadow:0 6px 18px rgba(212,86,143,.28)}
.them .m{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.me.last .m{border-bottom-right-radius:6px}
.them.last .m{border-bottom-left-radius:6px}
.m time{display:block;font-size:11px;margin-top:3px;opacity:.7;text-align:right}
.row:not(.last) .m:not(.has-img) time{display:none}
.m.has-img{width:min(78%,300px);padding:6px}
.m.has-img img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:14px}
.m.has-img .txt{padding:7px 8px 0}
.imeta{display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin-top:3px}
.imeta span{opacity:.7;font-size:16px;line-height:1}
.imeta time{margin-top:0}
.quote{margin:0 0 6px;padding:5px 9px;border-left:3px solid var(--glow);border-radius:8px;background:rgba(0,0,0,.2);font-size:13px;line-height:1.3;cursor:pointer}
.them .quote{background:rgba(255,255,255,.07);border-left-color:var(--rose)}
.quote b{display:block;font-size:12px;font-weight:700}
.quote span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.has-img .quote{margin:2px 2px 6px}
.chip{position:relative;z-index:1;margin:-9px 10px 0;padding:1px 8px;font-size:13px;line-height:1.5;border-radius:999px;background:#3a2358;border:1px solid var(--edge)}
.chip.mine{background:#4d2a68;border-color:var(--rose)}
.status{font-size:11px;color:var(--muted);margin:3px 6px 0}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(255,199,218,0)}30%{box-shadow:0 0 0 4px rgba(255,199,218,.6)}}
.flash .m{animation:flash 1.2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.pop .m{animation:pop .22s ease-out}

/* actions under a tapped message */
.act{display:none;margin:7px 2px 2px;flex-direction:column;gap:7px;max-width:100%}
.row.sel .act{display:flex}
.row.me .act{align-items:flex-end}
.row.them .act{align-items:flex-start}
.picker{display:flex;gap:2px;padding:4px 6px;background:rgba(30,18,50,.94);border:1px solid var(--edge);border-radius:999px}
.rx{background:none;border:0;font-size:22px;line-height:1;padding:5px;border-radius:50%;cursor:pointer}
.rx.on{background:rgba(242,121,159,.38)}
.rx:active{transform:scale(1.2)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.row.me .btns{justify-content:flex-end}
.del{background:var(--glass);border:1px solid var(--edge);color:#ffb3c1;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer}
.del.plain{color:var(--ink)}
.del.armed{background:#c93a5c;border-color:#c93a5c;color:#fff}

/* composer */
.pbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(21,13,36,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge)}
.pbar .info{flex:1;min-width:0;border-left:3px solid var(--rose);padding-left:9px;font-size:13px}
.pbar .info b{display:block;font-size:12px;color:var(--glow)}
.pbar .info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.pbar img{width:44px;height:44px;object-fit:cover;border-radius:10px}
form{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + var(--safe-bottom));background:rgba(21,13,36,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge)}
#attachBtn{width:46px;height:46px}
#msg{flex:1;min-width:0;padding:12px 16px;border-radius:22px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--ink);resize:none;max-height:120px;line-height:1.35}
#send{width:46px;height:46px;flex:none;border:0;border-radius:50%;color:#fff;cursor:pointer;display:grid;place-items:center;background:linear-gradient(135deg,var(--rose),var(--rose2));box-shadow:0 6px 18px rgba(212,86,143,.4)}
#send:disabled{opacity:.5}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* photo viewer */
#viewer{position:fixed;inset:0;z-index:20;background:rgba(10,5,20,.94);display:grid;place-items:center;padding:16px;cursor:zoom-out}
#viewer img{max-width:100%;max-height:100%;border-radius:12px}
@media (prefers-reduced-motion:reduce){.pop .m,.flash .m{animation:none}}
</style>
</head>
<body>

<section id="login">
  <div class="login-box">
    <h1>OurChat</h1>
    <p>Just the two of us.</p>
    <input id="email" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn">Log in</button>
    <div id="err" role="alert"></div>
  </div>
</section>

<section id="app" class="hidden home">
  <header>
    <div class="who">
      <button class="round small" id="back" type="button" aria-label="Back to chats">←</button>
      <div class="av" id="av">♥</div>
      <div><h2 id="title">OurChat</h2><small id="sub">Just we</small></div>
    </div>
    <button class="round" id="more" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <div id="menu" class="hidden">
      <div class="mine"><div class="av sm" id="myav"></div><span id="myname"></span></div>
      <button id="changePhoto">Change my photo</button>
      <button id="chName">Change my name</button>
      <button id="grpBtn" class="hidden">Group name and photo</button>
      <button id="delGrp" class="warn hidden">Delete group</button>
      <button id="bgBtn">Chat background</button>
      <button id="exportBtn">Export chat backup</button>
      <button id="chPass">Change password</button>
      <button id="addMember" class="hidden">Add member</button>
      <button id="rmPhoto" class="hidden">Remove my photo</button>
      <input id="avatarFile" type="file" accept="image/*" class="hidden">
      <button id="clearBtn" class="warn">Clear chat for me</button>
      <button id="logout">Log out</button>
    </div>
  </header>
  <input id="search" type="search" placeholder="Search people or groups" aria-label="Search people or groups" autocomplete="off">
  <div id="chats"></div>
  <button id="fab" type="button" aria-label="New chat">+</button>
  <div id="list"></div>
  <div id="replybar" class="pbar hidden">
    <div class="info"><b id="rbName"></b><span id="rbText"></span></div>
    <button class="round small" id="rbClose" type="button" aria-label="Cancel reply">×</button>
  </div>
  <div id="attachbar" class="pbar hidden">
    <img id="abImg" alt="Selected photo">
    <div class="info"><b>Photo</b><span>Add a caption if you like, then send</span></div>
    <button class="round small" id="abClose" type="button" aria-label="Remove photo">×</button>
  </div>
  <form id="form">
    <button class="round" id="attachBtn" type="button" aria-label="Add a photo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
    </button>
    <input id="file" type="file" accept="image/*" class="hidden">
    <textarea id="msg" rows="1" placeholder="Write a message" aria-label="Message"></textarea>
    <button id="send" type="submit" aria-label="Send message">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </form>
</section>

<div id="newSheet" class="hidden">
  <div class="sheet" role="dialog" aria-label="New chat">
    <h3>New group</h3>
    <p class="hint">Pick 2 to 4 people you already chat with. To message someone new, search their name on the main screen.</p>
    <div id="people"></div>
    <input id="gname" class="hidden" placeholder="Group name" maxlength="40">
    <button class="btn" id="startChat" type="button">Start chat</button>
  </div>
</div>

<div id="grpSheet" class="hidden">
  <div class="sheet" role="dialog" aria-label="Group settings">
    <h3>Group</h3>
    <div class="tools">
      <div class="av" id="gAv"></div>
      <button class="pill" id="gPhotoBtn" type="button">Change group photo</button>
      <button class="pill" id="gPhotoRm" type="button">Remove photo</button>
      <input id="gFile" type="file" accept="image/*" class="hidden">
    </div>
    <input id="gEdit" placeholder="Group name" maxlength="40">
    <button class="btn" id="gSave" type="button">Save</button>
  </div>
</div>

<div id="bgSheet" class="hidden">
  <div class="sheet" role="dialog" aria-label="Chat background">
    <h3>Chat background</h3>
    <div class="swatches" id="swatches"></div>
    <div class="tools">
      <button class="pill" id="bgPhotoBtn" type="button">Use my own photo</button>
      <button class="pill" id="bgReset" type="button">Reset</button>
      <input id="bgFile" type="file" accept="image/*" class="hidden">
    </div>
    <div id="dimWrap" class="hidden">
      <label for="dim">Photo dimming (makes messages easier to read)</label>
      <input id="dim" type="range" min="0" max="85" value="45">
    </div>
    <button class="btn" id="bgDone" type="button">Done</button>
  </div>
</div>

<div id="viewer" class="hidden"><img id="viewerImg" alt="Shared photo"></div>

<script type="module">

function listen(user){
  stopListening();
  const uid = user.uid;
  unsubs.push(onSnapshot(doc(db, "users", uid), s => {
    userDoc = s.exists() ? s.data({ serverTimestamps:"estimate" }) : {};
    const c = cur && userDoc["clr_" + cur.id];
    clearedMs = c ? c.toMillis() : 0;
    bgPref = { id: userDoc.bgId || "night", image: userDoc.bgImage || null, dim: typeof userDoc.bgDim === "number" ? userDoc.bgDim : 0.45 };
    applyBg();
    renderHome(user);
    render(user);
  }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, "users", uid, "hidden"), s => {
    hidden = new Set(s.docs.map(d => d.id));
    render(user);
  }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, "profiles"), s => {
    avatars = {};
    s.docs.forEach(d => { const a = d.data().avatar; if(a) avatars[d.id] = a; });
    paintHeader(user); renderHome(user);
  }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, "members"), s => {
    NAMES = {};
    s.docs.forEach(d => { NAMES[d.id] = d.data().name || "?"; });
    paintHeader(user); renderHome(user); render(user);
  }, err => console.error(err)));
  unsubs.push(onSnapshot(query(collection(db, "chats"), where("members", "array-contains", uid)), s => {
    chatsList = s.docs.map(d => ({ id:d.id, ...d.data({ serverTimestamps:"estimate" }) }));

    $("chats").textContent = "";
    $("chats").appendChild(emptyState("Can’t load chats. Check your internet and the Firestore rules."));
    console.error(err);
  }));
}

function markSeen(user, all){
  if(!cur || document.visibilityState !== "visible" || marking) return;
  let latest = 0;
  all.forEach(x => {
    if(x.m.uid !== user.uid && !x.pending && x.m.createdAt) latest = Math.max(latest, x.m.createdAt.toMillis());
  });
  if(latest && latest > (seenMap[user.uid] || 0)){
    marking = true;
    setDoc(doc(db, "chats", cur.id, "seen", user.uid), { seenAt: serverTimestamp() })
      .catch(err => console.error(err))
      .finally(() => { marking = false; });
  }
}

/* export: one self-contained HTML file that opens on any phone, with the full data embedded for restoring later */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
async function exportChat(){
  const user = auth.currentUser;
  if(!user || !cur){ alert("Open a chat first."); return; }
  const btn = $("exportBtn");
  btn.disabled = true; btn.textContent = "Exporting…";
  try {
    const snap = await getDocs(query(collection(db, "chats", cur.id, "messages"), orderBy("createdAt")));
    const msgs = snap.docs.map(d => {
      const m = d.data();
      const o = { id: d.id, uid: m.uid, text: m.text || "", createdAt: m.createdAt ? m.createdAt.toMillis() : null };
      if(m.name) o.name = m.name;
      if(m.image) o.image = m.image;
      if(m.replyTo) o.replyTo = m.replyTo;
      if(m.reactions && Object.keys(m.reactions).length) o.reactions = m.reactions;
      return o;
    });
    const who = uid => NAMES[uid] || "Unknown";
    let lastDay = "", body = "";
    msgs.forEach(m => {
      const t = m.createdAt ? new Date(m.createdAt) : null;
      const day = t ? t.toLocaleDateString([], { weekday:"short", day:"numeric", month:"short", year:"numeric" }) : "";
      if(day !== lastDay){ body += '<div class="day">' + esc(day) + '</div>'; lastDay = day; }
      let h = '<div class="msg ' + (m.uid === user.uid ? "me" : "them") + '"><div class="who">' + esc(who(m.uid)) + '</div>';
      if(m.replyTo) h += '<div class="quote"><b>' + esc(who(m.replyTo.uid)) + '</b>' + esc(m.replyTo.text) + '</div>';
      if(m.image) h += '<img src="' + m.image + '" alt="Photo">';
      if(m.text) h += '<div class="txt">' + esc(m.text) + '</div>';
      if(m.reactions) h += '<div class="rx">' + Object.keys(m.reactions).map(u => esc(who(u)) + " " + esc(m.reactions[u])).join(" · ") + '</div>';
      h += '<div class="time">' + (t ? esc(t.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })) : "") + '</div></div>';
      body += h;
    });
    const pair = cur.members.map(k => NAMES[k] || "?").join(" & ");
    const dated = msgs.filter(m => m.createdAt);
    const fmt = ms => new Date(ms).toLocaleDateString([], { day:"numeric", month:"short", year:"numeric" });
    const range = dated.length ? "from " + fmt(dated[0].createdAt) + " to " + fmt(dated[dated.length - 1].createdAt) : "";
    const json = JSON.stringify({ app:"OurChat", chat:pair, exportedBy:NAMES[user.uid] || "unknown", exportedAt:new Date().toISOString(), names:NAMES, messages:msgs }).replace(/</g, "\\u003c");
    const css = "body{padding:16px;background:#1d1230;color:#f6edfb;font-family:system-ui,sans-serif;max-width:720px;margin:0 auto}h1{font-style:italic;color:#ffc7da;margin:8px 0 2px}.meta{color:#b5a2c9;font-size:13px;margin:0 0 14px}.day{text-align:center;color:#b5a2c9;font-size:12px;margin:16px 0 8px}.msg{max-width:80%;margin:6px 0;padding:8px 12px;border-radius:16px;overflow-wrap:anywhere}.me{margin-left:auto;background:#d4568f;color:#fff}.them{margin-right:auto;background:#3a2358}.who{font-size:11px;opacity:.75;margin-bottom:2px;font-weight:700}.txt{white-space:pre-wrap}.msg img{display:block;max-width:100%;border-radius:12px;margin:4px 0}.quote{border-left:3px solid #ffc7da;background:rgba(0,0,0,.2);padding:4px 8px;margin-bottom:6px;font-size:13px;border-radius:6px}.quote b{display:block;font-size:11px}.rx{font-size:12px;margin-top:4px;opacity:.9}.time{font-size:11px;opacity:.65;text-align:right;margin-top:3px}";
    const html = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(pair) + ' | OurChat backup</title><style>' + css + '</style></head><body><h1>' + esc(pair) + '</h1><p class="meta">OurChat backup<br>' + msgs.length + ' messages' + (range ? ', ' + esc(range) : '') + '<br>Saved by ' + esc(NAMES[user.uid] || "unknown") + ' on ' + esc(new Date().toLocaleString()) + '</p>' + body + '<script type="application/json" id="ourchat-data">' + json + '<\/script></body></html>';
    const n = new Date();
    const stamp = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type:"text/html" }));
    a.download = "OurChat-" + cur.members.map(k => NAMES[k] || "x").join("-") + "-backup-" + stamp + ".html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch(err){
    alert("Could not export the chat. Check your internet and try again.");
    console.error(err);
  }
  btn.disabled = false; btn.textContent = "Export chat backup";
}
$("exportBtn").addEventListener("click", exportChat);

/* chat background: each person picks their own, saved privately to their account */
function applyBg(){
  const b = document.body;
  if(bgPref.id === "photo" && bgPref.image){
    const o = "rgba(10,5,20," + bgPref.dim + ")";
    b.style.background = "linear-gradient(" + o + "," + o + "), url(\"" + bgPref.image + "\") center/cover no-repeat fixed";
    b.classList.add("nostars");
  } else {
    const p = PRESETS.find(x => x.id === bgPref.id) || PRESETS[0];
    b.style.background = p.css;
    if(p.css) b.style.backgroundAttachment = "fixed";
    b.classList.toggle("nostars", !p.stars);
  }
  markSwatches();
}
function markSwatches(){
  document.querySelectorAll(".sw").forEach(el => el.classList.toggle("on", el.dataset.id === bgPref.id));
  const photo = bgPref.id === "photo" && bgPref.image;
  $("dimWrap").classList.toggle("hidden", !photo);
  $("dim").value = Math.round(bgPref.dim * 100);
}
async function saveBg(fields){

}

$("bgSheet").addEventListener("click", e => { if(e.target === $("bgSheet")) $("bgSheet").classList.add("hidden"); });
$("bgReset").addEventListener("click", () => saveBg({ bgId:"night", bgImage: deleteField() }));
$("bgPhotoBtn").addEventListener("click", () => $("bgFile").click());
$("bgFile").addEventListener("change", async () => {

/* round avatars: each person can set their own photo */
function paintAv(el, uid, fallback){
  const src = uid && avatars[uid];
  if(src){ el.style.backgroundImage = 'url("' + src + '")'; el.textContent = ""; }
  else { el.style.backgroundImage = ""; el.textContent = fallback; }
}
function chatTitle(c, me){
  if(c.type === "dm") return NAMES[c.members.find(k => k !== me)] || "Chat";
  return c.name || "Group";
}
function paintChatAv(el, c, me, letter){
  if(c.type === "dm") return paintAv(el, chatAvUid(c, me), letter);
  if(c.photo){ el.style.backgroundImage = 'url("' + c.photo + '")'; el.textContent = ""; }
  else { el.style.backgroundImage = ""; el.textContent = letter; }
}
function chatAvUid(c, me){ return c.type === "dm" ? c.members.find(k => k !== me) : null; }
function paintHeader(user){
  const myName = NAMES[user.uid] || "You";
  $("myname").textContent = myName;
  paintAv($("myav"), user.uid, myName[0]);
  $("rmPhoto").classList.toggle("hidden", !avatars[user.uid]);
  $("addMember").classList.toggle("hidden", user.uid !== ADMIN);
  $("chPass").classList.toggle("hidden", user.uid !== ADMIN);
  $("grpBtn").classList.toggle("hidden", !(cur && cur.type === "group"));
  $("delGrp").classList.toggle("hidden", !(cur && cur.type === "group" && cur.createdBy === user.uid));
  $("clearBtn").textContent = cur ? "Clear chat for me" : "Clear all chats for me";
  $("exportBtn").classList.toggle("hidden", !cur);
  if(cur){
    const t = chatTitle(cur, user.uid);
    $("title").textContent = t;
    $("sub").textContent = cur.type === "dm" ? "OurChat" : cur.members.length + " people";
    paintChatAv($("av"), cur, user.uid, t[0]);
  } else {
    $("title").textContent = "OurChat"; $("sub").textContent = "Just we";
    $("av").style.backgroundImage = 'url("icon-192.png")'; $("av").textContent = "";
  }
}
$("av").addEventListener("click", () => {
  const u = auth.currentUser; if(!u || !cur) return;
  const o = chatAvUid(cur, u.uid);
  if(o && avatars[o]) openViewer(avatars[o]);
  else if(cur.type === "group" && cur.photo) openViewer(cur.photo);
});
function squareAvatar(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const s = Math.min(img.width, img.height);
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 256, 256);
      ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}
$("changePhoto").addEventListener("click", () => $("avatarFile").click());
$("avatarFile").addEventListener("change", async () => {
  const f = $("avatarFile").files[0];
  const user = auth.currentUser;

  try {
    const data = await squareAvatar(f);
    await setDoc(doc(db, "profiles", user.uid), { avatar: data, updatedAt: serverTimestamp() });

});
$("rmPhoto").addEventListener("click", async () => {

});

function render(user){
  if(!cur || !lastSnap) return;
  const list = $("list");
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
  const all = lastSnap.docs.map(d => ({ id:d.id, m:d.data({ serverTimestamps:"estimate" }), pending:d.metadata.hasPendingWrites }));
  markSeen(user, all);
  const items = all
    .filter(x => !hidden.has(x.id))
    .map(x => ({ ...x, t: x.m.createdAt ? x.m.createdAt.toDate() : new Date() }))
    .filter(x => !clearedMs || x.t.getTime() > clearedMs);
  list.textContent = "";
  if(!items.length){
    list.appendChild(emptyState("No messages yet. Say hi!"));
    seen = new Set(); loaded = true; return;
  }
  let otherSeenMs = 0;
  Object.keys(seenMap).forEach(k => { if(k !== user.uid) otherSeenMs = Math.max(otherSeenMs, seenMap[k]); });
  let lastMineIdx = -1;
  items.forEach((x, i) => { if(x.m.uid === user.uid) lastMineIdx = i; });

  const dayOf = i => i < 0 || i >= items.length ? "" : items[i].t.toDateString();
  let lastDay = "";
  items.forEach((it, i) => {
    const m = it.m, t = it.t;
    if(dayOf(i) !== lastDay){
      const dd = document.createElement("div");
      dd.className = "day";
      dd.textContent = t.toLocaleDateString([], { day:"numeric", month:"short", year:"numeric" });
      list.appendChild(dd); lastDay = dayOf(i);
    }
    const mine = m.uid === user.uid;
    const first = i === 0 || items[i-1].m.uid !== m.uid || dayOf(i-1) !== dayOf(i);
    const last = i === items.length-1 || items[i+1].m.uid !== m.uid || dayOf(i+1) !== dayOf(i);
    const rx = m.reactions || {};
    const vals = Object.values(rx);
    const row = document.createElement("div");
    row.className = "row " + (mine ? "me" : "them") + (first ? " first" : "") + (last ? " last" : "")
      + (vals.length ? " has-rx" : "") + (loaded && !seen.has(it.id) ? " pop" : "") + (selId === it.id ? " sel" : "");
    row.dataset.id = it.id;

    const b = document.createElement("div");
    b.className = "m" + (m.image ? " has-img" : "");
    if(m.replyTo){
      const q = m.replyTo;
      const qd = document.createElement("div");
      qd.className = "quote";
      const qn = document.createElement("b"); qn.textContent = labelFor(q.uid, q.name, user.uid);
      const qt = document.createElement("span"); qt.textContent = q.text || "";
      qd.append(qn, qt);
      qd.addEventListener("click", ev => {
        ev.stopPropagation();
        const target = document.querySelector('[data-id="' + q.id + '"]');
        if(target){
          target.scrollIntoView({ block:"center", behavior:"smooth" });
          target.classList.add("flash");
          setTimeout(() => target.classList.remove("flash"), 1300);
        }
      });
      b.appendChild(qd);
    }
    if(m.image){
      const im = document.createElement("img");
      im.src = m.image; im.alt = "Shared photo"; im.loading = "lazy";
      im.addEventListener("click", ev => { ev.stopPropagation(); openViewer(m.image); });
      b.appendChild(im);
    }
    if(m.text){
      const tx = document.createElement("div");
      tx.className = "txt"; tx.textContent = m.text;
      b.appendChild(tx);
    }
    const tm = document.createElement("time");
    tm.textContent = t.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
    if(m.image){
      const meta = document.createElement("div");
      meta.className = "imeta";
      const dots = document.createElement("span");
      dots.textContent = "⋯"; dots.setAttribute("aria-hidden", "true");
      meta.append(dots, tm);
      b.appendChild(meta);
    } else {
      b.appendChild(tm);
    }
    row.appendChild(b);

    if(vals.length){
      const chip = document.createElement("div");
      chip.className = "chip" + (rx[user.uid] ? " mine" : "");
      chip.textContent = [...new Set(vals)].join("") + (vals.length > 1 ? " " + vals.length : "");
      row.appendChild(chip);
    }

    if(i === lastMineIdx){
      const st = document.createElement("div");
      st.className = "status";
      const seenBy = Object.keys(seenMap).filter(k => k !== user.uid && seenMap[k] >= t.getTime()).map(k => NAMES[k] || "?");
      st.textContent = it.pending ? "Sending…" : (!seenBy.length ? "Sent" : (cur.type === "dm" ? "Seen" : "Seen by " + seenBy.join(", ")));
      row.appendChild(st);
    }

    const act = document.createElement("div");
    act.className = "act";
    const picker = document.createElement("div");
    picker.className = "picker";
    REACTIONS.forEach(([e, label]) => {
      const rb = document.createElement("button");
      rb.type = "button"; rb.className = "rx" + (rx[user.uid] === e ? " on" : "");
      rb.textContent = e; rb.title = label; rb.setAttribute("aria-label", label);
      rb.addEventListener("click", ev => { ev.stopPropagation(); react(it.id, user.uid, rx[user.uid] === e ? null : e); });
      picker.appendChild(rb);
    });
    act.appendChild(picker);

    const btns = document.createElement("div");
    btns.className = "btns";
    const rep = document.createElement("button");
    rep.type = "button"; rep.className = "del plain"; rep.textContent = "Reply";
    rep.addEventListener("click", ev => { ev.stopPropagation(); setReply(user, it); });
    btns.appendChild(rep);
    const dme = document.createElement("button");
    dme.type = "button"; dme.className = "del plain"; dme.textContent = "Delete for me";
    dme.addEventListener("click", ev => { ev.stopPropagation(); hideForMe(it.id, user.uid); });
    btns.appendChild(dme);
    if(mine){
      const dall = document.createElement("button");
      dall.type = "button"; dall.className = "del"; dall.textContent = "Delete for everyone";
      let timer = null;
      dall.addEventListener("click", async ev => {
        ev.stopPropagation();
        if(!dall.classList.contains("armed")){
          dall.classList.add("armed"); dall.textContent = "Tap again to delete";
          timer = setTimeout(() => { dall.classList.remove("armed"); dall.textContent = "Delete for everyone"; }, 3000);
          return;
        }
        clearTimeout(timer);
        try { await deleteDoc(doc(db, "chats", cur.id, "messages", it.id)); selId = null; }
        catch(err){ alert("Could not delete. Check your internet and the Firestore rules."); console.error(err); }
      });
      btns.appendChild(dall);
    }
    act.appendChild(btns);
    row.appendChild(act);

    b.addEventListener("click", () => {
      selId = selId === it.id ? null : it.id;
      document.querySelectorAll(".row.sel").forEach(r => r.classList.remove("sel"));
      if(selId) row.classList.add("sel");
    });
    if(!mine){
      // other people's messages: small round photo beside the last message of a run, their name above the first
      const who = NAMES[m.uid] || m.name || "?";
      const col = document.createElement("div"); col.className = "col";
      if(first){ const nm = document.createElement("div"); nm.className = "sname"; nm.textContent = who; col.appendChild(nm); }
      while(row.firstChild) col.appendChild(row.firstChild);
      const slot = document.createElement("div"); slot.className = "avs";
      if(last){ const a = document.createElement("div"); a.className = "av xs"; paintAv(a, m.uid, who[0]); slot.appendChild(a); }
      row.append(slot, col);
    }
    list.appendChild(row);
  });
  seen = new Set(items.map(x => x.id));
  if(nearBottom || !loaded) list.scrollTop = list.scrollHeight;
  loaded = true;
}

$("list").addEventListener("click", e => {
  if(e.target === $("list")){ selId = null; document.querySelectorAll(".row.sel").forEach(r => r.classList.remove("sel")); }
});

/* photos from the gallery: shrunk before sending so they fit in the database */
function compress(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      let q = 0.72, out = c.toDataURL("image/jpeg", q);
      while(out.length > 380000 && q > 0.35){ q -= 0.08; out = c.toDataURL("image/jpeg", q); }
      if(out.length > 800000) reject(new Error("too big")); else resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

/* composer */
const msg = $("msg");
const grow = () => { msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 120) + "px"; };
msg.addEventListener("input", grow);
msg.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && window.matchMedia("(min-width:700px)").matches){
    e.preventDefault(); $("form").requestSubmit();
  }
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = msg.value.trim();
  const user = auth.currentUser;
  if((!text && !attach) || !user || !cur) return;
  $("send").disabled = true;
  const data = { text, uid: user.uid, name: cap((user.email || "").split("@")[0]), createdAt: serverTimestamp() };
  if(attach) data.image = attach;
  if(replyTo) data.replyTo = replyTo;
  try{
    await addDoc(collection(db, "chats", cur.id, "messages"), data);
    updateDoc(doc(db, "chats", cur.id), { last: { text: snippet(data), uid: user.uid, at: serverTimestamp() } }).catch(console.error);
    msg.value = ""; msg.style.height = "auto";
    clearReply(); clearAttach();
    const l = $("list"); l.scrollTop = l.scrollHeight;
  }catch(err){
    alert("Message not sent. Check your internet and try again.");
    console.error(err);
  }
  $("send").disabled = false;
  msg.focus();
});
